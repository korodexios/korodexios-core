<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Korodexios Shell</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="btn-list" type="button" class="icon-button narrow-only" title="Show the side list" aria-label="Show the side list"></button>
      <span class="brand"><span id="brand-logo" aria-hidden="true"></span><span id="app-name">korodexios</span></span>
      <span class="crumbs"><span id="crumb-area"></span><span id="crumb-item" class="muted"></span></span>
      <span class="grow"></span>
      <button id="btn-palette" type="button" class="palette-button" title="Command palette (Ctrl+K)" aria-label="Command palette"><span id="palette-icon"></span><span>Search</span><kbd>Ctrl+K</kbd></button>
      <div id="pane-toggles" class="toggles" role="group" aria-label="Show or hide panels"></div>
      <select id="theme-select" aria-label="Theme" title="Theme"></select>
      <select id="lang" aria-label="Language" title="Language"><option value="en">English</option></select>
      <span id="state-pill" class="pill">offline</span>
      <a class="link-button" href="console.html" title="The classic console: commands, logs, config, events">Classic console</a>
    </header>

    <div class="body">
      <nav id="ribbon" class="ribbon" aria-label="Areas"></nav>

      <aside id="side" class="side" aria-label="Side list">
        <div class="pane-head"><button id="side-back" type="button" class="plain narrow-only">Back</button><span id="side-title" class="pane-title"></span>
          <span class="grow"></span>
          <button id="btn-collapse" type="button" class="icon-button" title="Collapse all" aria-label="Collapse all"></button>
        </div>
        <div id="side-body" class="pane-body"></div>
      </aside>
      <button id="split-side" type="button" class="splitter vertical" aria-label="Resize side list. Arrow keys change the width, double click resets"></button>

      <div class="center">
        <main class="main" aria-label="Main surface">
          <div id="tabs" class="tabs" role="tablist"></div>
          <div id="surfaces" class="surfaces">
            <div id="surface" class="surface" data-surface="a"></div>
            <div id="surface-b" class="surface" data-surface="b" hidden></div>
          </div>
        </main>
        <button id="split-bottom" type="button" class="splitter horizontal" aria-label="Resize bottom panel. Arrow keys change the height, double click resets"></button>
        <section id="bottom" class="bottom" aria-label="Bottom panel">
          <div class="pane-head"><span class="pane-title">Docked</span></div>
          <div id="bottom-body" class="pane-body"></div>
        </section>
      </div>

      <button id="split-inspector" type="button" class="splitter vertical" aria-label="Resize inspector. Arrow keys change the width, double click resets"></button>
      <aside id="inspector" class="inspector" aria-label="Inspector">
        <div class="pane-head"><span class="pane-title">Inspector</span></div>
        <div id="inspector-body" class="pane-body"></div>
      </aside>
    </div>

    <footer class="statusbar"><span id="status-theme"></span><span id="status-layout"></span><span class="grow"></span><span id="status-user"></span></footer>
  </div>

  <section id="token-gate" class="gate" hidden>
    <h2>Session token needed</h2>
    <p>Open the shell with "kdx ui", or paste a token.</p>
    <form id="token-form" class="row">
      <input id="token-input" type="password" autocomplete="off" placeholder="token" aria-label="token">
      <label class="keep">Remember <select id="token-keep"></select></label>
      <button type="submit">Connect</button>
      <button id="token-forget" type="button" class="plain">Forget</button>
    </form>
    <p id="token-error" class="error" hidden></p>
  </section>

  <div id="palette" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" autocomplete="off" placeholder="Type to find an area, a panel or an action" aria-label="Command palette">
      <ul id="palette-list" class="palette-list" role="listbox"></ul>
    </div>
  </div>

  <div id="shortcuts" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="shortcuts-title">
      <div class="row"><h2 id="shortcuts-title">Keyboard shortcuts</h2><span class="grow"></span>
        <button id="shortcuts-close" type="button" class="plain">Close</button></div>
      <dl id="shortcuts-list" class="kv"></dl>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="token-store.js"></script>
  <script src="shell.js"></script>
</body>
</html>
