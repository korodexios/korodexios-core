# Built-in module manifest, read by korodexios_core.kernel.discovery.
[module]
name = "job_queue"
description = "Runs the durable work queue: workers, retries, /api/v1/queue and kdx queue."
version = "0.1.0"
entrypoint = "MODULE"
enabled = true
priority = 45
requires_core = ">=0.1"

[metadata]
tags = ["jobs", "queue"]
owner = "korodexios"

# The GUI this module contributes: a generic renderer draws it from /api/v1/ui/manifest.
[ui]
title = "Queue"
order = 40

[[ui.panels]]
id = "stats"
type = "keyvalue"
title = "Tasks by state"
source = "/api/v1/queue"
path = "stats"
refresh = 5

[[ui.panels]]
id = "tasks"
type = "table"
title = "Latest tasks"
source = "/api/v1/queue"
path = "tasks"
columns = ["id", "kind", "state", "attempts", "error"]
refresh = 5

[[ui.panels]]
id = "submit"
type = "form"
title = "Queue a task"
command = "queue submit"

[[ui.panels]]
id = "housekeeping"
type = "actions"
title = "Housekeeping"
[[ui.panels.buttons]]
id = "purge"
label = "Purge finished tasks"
command = "queue purge"
confirm = true
